services:
  catalog-postgres:
    image: postgres:16-alpine
    container_name: persistent4s-catalog-postgres
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog_events
    ports:
      - "5435:5432"
    volumes:
      - ./catalog-init-views.sql:/docker-entrypoint-initdb.d/init-views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  enrollment-postgres:
    image: postgres:16-alpine
    container_name: persistent4s-enrollment-postgres
    environment:
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment
      POSTGRES_DB: enrollment_events
    ports:
      - "5434:5432"
    volumes:
      - ./enrollment-init-views.sql:/docker-entrypoint-initdb.d/init-views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: persistent4s-courses-kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
