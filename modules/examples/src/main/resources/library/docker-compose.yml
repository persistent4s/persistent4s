version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: persistent4s-library-postgres
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-views.sql:/docker-entrypoint-initdb.d/init-views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_events"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
