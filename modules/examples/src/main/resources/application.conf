# Configuration for the persistent4s examples
# This file is used when running a service locally, and is loaded by default by the test suite as well.

# Library service event store
persistent4s.postgres {
  host = "localhost"
  port = 5432
  user = "library"
  password = "library"
  database = "library_events"
  max-connections = 64
  ssl = { type = disabled }
}

# Catalog service event store
persistent4s.catalog.postgres {
  host = "localhost"
  port = 5435
  user = "catalog"
  password = "catalog"
  database = "catalog_events"
  max-connections = 32
  ssl = { type = disabled }
}

# Enrollment service event store
persistent4s.enrollment.postgres {
  host = "localhost"
  port = 5434
  user = "enrollment"
  password = "enrollment"
  database = "enrollment_events"
  max-connections = 32
  ssl = { type = disabled }
}

# Shared Kafka bootstrap for both services (catalog + enrollment example)
persistent4s.courses.kafka {
  bootstrap-servers = "localhost:9094"
}

# --- saga example (orders + inventory) ---------------------------------------------------------------------------
# Same host ports as the courses example on purpose: they are known to be free on a machine that has run that one, so
# only one of the two examples can be up at a time.

# Orders service event store — hosts the reserve-stock saga
persistent4s.orders.postgres {
  host = "localhost"
  port = 5435
  user = "orders"
  password = "orders"
  database = "orders_events"
  max-connections = 32
  ssl = { type = disabled }
}

# Inventory service event store — owns stock, answers the saga's requests
persistent4s.inventory.postgres {
  host = "localhost"
  port = 5434
  user = "inventory"
  password = "inventory"
  database = "inventory_events"
  max-connections = 32
  ssl = { type = disabled }
}

# Shared Kafka bootstrap for both services (orders + inventory example)
persistent4s.saga.kafka {
  bootstrap-servers = "localhost:9094"
}
