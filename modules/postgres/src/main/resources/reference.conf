# Persistent4s PostgreSQL Event Store Configuration
#
# This is a reference configuration that shows the expected structure.
# Users should override these values in their application.conf file.
#
# Example application.conf:
#
# persistent4s.postgres {
#   host = "localhost"
#   port = 5432
#   user = "my_user"
#   password = "my_password"
#   database = "eventstore"
#   max-connections = 10
# }

persistent4s.postgres {
  # The PostgreSQL server hostname
  host = "localhost"
  
  # The PostgreSQL server port
  port = 5432
  
  # Database user (must be provided by user)
  # user = ""
  
  # Database password (must be provided by user)  
  # password = ""
  
  # Database name (must be provided by user)
  # database = ""
  
  # Maximum number of connections in the pool
  max-connections = 10
}
